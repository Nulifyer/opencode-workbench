version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      opencode:
        patterns:
          - "@opencode-ai/*"
      vscode:
        patterns:
          - "@vscode/*"
    ignore:
      - dependency-name: "@types/vscode"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
