name: release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.9.4
      - run: deno task release
      - uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373
        with:
          subject-path: |
            dist/opencode-plugin.js
            dist/opencode-workbench-vscode-*.vsix
            dist/release.json
            dist/SHA256SUMS
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        with:
          files: |
            dist/opencode-plugin.js
            dist/opencode-workbench-vscode-*.vsix
            dist/release.json
            dist/SHA256SUMS

  marketplace:
    if: vars.PUBLISH_MARKETPLACE == 'true'
    needs: release
    runs-on: ubuntu-latest
    environment: marketplace
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.9.4
      - run: deno install --frozen
      - name: Download verified release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/workbench-release"
          gh release download "$GITHUB_REF_NAME" --dir "$RUNNER_TEMP/workbench-release"
          cd "$RUNNER_TEMP/workbench-release"
          sha256sum --check SHA256SUMS
          gh attestation verify "opencode-workbench-vscode-${GITHUB_REF_NAME#v}.vsix" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-ref "$GITHUB_REF" \
            --deny-self-hosted-runners
      - name: Verify Marketplace credentials
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: deno run -A ./node_modules/@vscode/vsce/vsce verify-pat nulifyer -p "$VSCE_PAT"
      - name: Publish VS Code extension
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          deno run -A ./node_modules/@vscode/vsce/vsce publish \
            --packagePath "$RUNNER_TEMP/workbench-release/opencode-workbench-vscode-${GITHUB_REF_NAME#v}.vsix" \
            -p "$VSCE_PAT"
